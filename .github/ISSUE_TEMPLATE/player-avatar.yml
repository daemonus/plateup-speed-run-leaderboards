name: Player avatar
description: Submit an avatar to show next to your name on the leaderboards
title: Player avatar
labels: ["player-avatar"]
body:
  - type: markdown
    attributes:
      value: |
        Submit your avatar for the leaderboards — just your **player ID** and a **256×256 PNG**.
        A bot checks it and opens a pull request for a moderator to merge. You can leave the
        issue title as-is; it's set automatically.
  - type: input
    id: player-id
    attributes:
      label: Player ID
      description: On the Leaderboards page, right-click your name and choose **Copy ID**.
      placeholder: e5c02f61-4d29-4de0-8a8f-7668c4397d22
    validations:
      required: true
  - type: textarea
    id: image
    attributes:
      label: Image
      description: Drag-and-drop your 256×256 PNG here (any file name — it's renamed automatically).
    validations:
      required: true
